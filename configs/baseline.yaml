seed: 42
deterministic: false

# PROVISIONAL RECONSTRUCTION CONFIGURATION
# Numeric defaults below are new implementation choices, not recovered settings.
# Required unknowns remain null and are rejected by the CLI before execution.
provenance:
  historical_fidelity: false
  status: provisional_reconstruction

dataset:
  name: radioml2018
  path: data/raw/
  file: null
  schema:
    samples_key: null
    labels_key: null
    snr_key: null
    class_names: null
  task_type: null
  classes: null
  snr_min: null
  snr_max: null
  input_length: null
  max_examples_per_class: null
  sample_seed: 42
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15

preprocessing:
  normalization: none
  remove_dc: false
  amplitude_scale:
    enabled: false
    min: 0.8
    max: 1.2
  phase_rotation:
    enabled: false
  awgn:
    enabled: false
    snr_db_min: null
    snr_db_max: null
  frequency_offset:
    enabled: false
    max_normalized_offset: null

model:
  name: provisional_compact_cnn
  num_classes: null
  conv_channels: [64, 128, 256]
  kernel_sizes: [7, 5, 3]
  pooling: [2, 2, 2]
  dropout: 0.3
  classifier_size: 384

training:
  epochs: 50
  batch_size: 128
  num_workers: 0
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  early_stopping_patience: 8
  device: auto
